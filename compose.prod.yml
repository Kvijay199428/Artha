services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Not exposed externally — Nginx proxies to it
    expose:
      - "8000"
    volumes:
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=sqlite:///./storage/artha.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-in-production}
      # Leave CORS_ORIGINS empty — backend is accessed via Nginx proxy (same origin)
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    restart: unless-stopped
    networks:
      - artha

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    ports:
      - "28031:80"
    depends_on:
      - backend
    networks:
      - artha
    restart: unless-stopped

networks:
  artha:
    driver: bridge
