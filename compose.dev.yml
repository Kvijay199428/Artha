services:
  backend_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "28030:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    environment:
      - DATABASE_URL=sqlite:///./storage/artha.db
      - JWT_SECRET_KEY=dev_secret_key
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:4173,http://localhost:28031
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "28031:80"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://localhost:28030/api/v1
